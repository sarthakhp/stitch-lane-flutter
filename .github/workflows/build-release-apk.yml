name: Build Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write # needed to create the GitHub Release below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable

      # Recreates the git-ignored, locally-held files the release build needs
      # (signing keystore, Firebase config, API keys) from repo secrets. None
      # of these are ever committed — see app/.gitignore.
      - name: Restore signing + config secrets
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app-release.jks
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          echo "$ENV_FILE_BASE64" | base64 --decode > .env
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$(pwd)/android/app-release.jks
          EOF

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StitchGenie-release-universal-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Read app version
        id: app_version
        run: echo "value=$(grep '^version:' app/pubspec.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Rename APK for release
        run: cp app/build/app/outputs/flutter-apk/app-release.apk StitchGenie-release-universal.apk

      # A stable, easy-to-share download link for users, on top of the
      # workflow artifact above. Tag includes the run number since the
      # pubspec version doesn't bump on every commit — keeps tags unique.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.value }}-run${{ github.run_number }}
          name: StitchGenie v${{ steps.app_version.outputs.value }} (run ${{ github.run_number }})
          body: Automated build from commit ${{ github.sha }}.
          files: StitchGenie-release-universal.apk
