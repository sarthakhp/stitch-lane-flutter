name: stitch_lane_app
description: StitchGenie Flutter Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  uuid: ^4.5.2
  provider: ^6.1.5+1
  intl: ^0.20.2
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2
  googleapis: ^15.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  flutter_contacts: ^1.1.9+2
  url_launcher: 6.2.6
  logger: ^2.6.2
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  http: ^1.2.0
  record: ^5.1.2
  permission_handler: ^11.0.0
  home_widget: ^0.7.0
  audioplayers: ^6.0.0
  flutter_pcm_sound: ^3.3.3
  flutter_dotenv: ^6.0.0
  flutter_quill: ^11.5.0
  markdown_quill: ^4.3.0
  flutter_markdown_plus: ^1.0.6
  markdown: ^7.3.0
  flutter_localizations:
    sdk: flutter
  workmanager: ^0.9.0+3
  battery_plus: ^7.0.0
  flutter_local_notifications: ^19.5.0
  flutter_native_contact_picker: ^0.0.11
  photo_view: ^0.15.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  sqflite: ^2.4.1
  path: ^1.9.0
  archive: ^4.0.0
  file_picker: ^8.0.0
  langchain: ^0.8.1
  langchain_google: ^0.7.1
  flutter_image_compress: ^2.4.0
  toonx: ^1.3.0
  web_socket_channel: ^3.0.0
  googleai_dart:
    git:
      url: https://github.com/davidmigloz/ai_clients_dart.git
      path: packages/googleai_dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  record_linux: ^1.0.0
  googleai_dart:
    git:
      url: https://github.com/davidmigloz/ai_clients_dart.git
      path: packages/googleai_dart
  langchain_google:
    path: ../langchain_google_patch

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon_for_light_background.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon_for_light_background.png"

